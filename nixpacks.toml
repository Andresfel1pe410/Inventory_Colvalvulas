[variables]
    PYTHONUNBUFFERED = "1"

[phases.setup]
    nixPkgs = ["python3", "gcc"] # Agrega gcc si alguna librería necesita compilar

[phases.install]
    cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install -r requirements.txt"]

[start]
    # 1 worker por defecto (ver app/main.py). Subir con la variable WEB_CONCURRENCY si hiciera falta.
    cmd = "/bin/sh -c '/opt/venv/bin/uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers ${WEB_CONCURRENCY:-1}'"